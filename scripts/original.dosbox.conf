# DOSBox Staging settings for the original Teratron (see run-original.sh, which starts
# DOSBox in old-tron/compiled). They are applied on top of your own configuration.

[dosbox]
machine = svga_s3
memsize = 32

[cpu]
core = auto
cputype = pentium
cpu_cycles_protected = max

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5
